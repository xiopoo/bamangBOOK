# AI 关注方向配置（基本面聚焦版）
# AI 会依据这里的定位对原始信号做筛选、翻译、摘要，并判定机会/风险。
# 本版仅关注会影响企业内在价值的基本面实质变化，忽略行情、技术面与情绪。

persona: >
  我是一名以基本面为核心的中长线投资者，持仓周期数月到数年。
  我只关心会影响企业内在价值的实质性经营与财务变化：业绩、订单、产能、
  产品、市占率、毛利率、回购分红、并购重组、重大合同、监管处罚等。
  我完全不关心日内涨跌、技术面形态、资金博弈、情绪化喊单与股吧讨论。

dimensions:
  - key: fundamental
    name: 基本面经营变化
    weight: 10
    description: 营收/利润/毛利率变化、业绩预告与财报超预期或不及预期、重大订单与合同、产能投放与扩产、新产品量产、市占率变化、成本端与价格传导。

  - key: announcement
    name: 重大公告与资本运作
    weight: 10
    description: 并购重组、定增配股、分红与回购方案、股东增持、高管变动、诉讼仲裁、停复牌、退市风险警示、债务与违约。

  - key: valuation
    name: 估值与预期差
    weight: 7
    description: 研报评级与目标价调整、一致预期上修下修、与同业估值的显著偏离、回购注销带来的每股价值提升。

  - key: policy
    name: 政策与监管实质影响
    weight: 8
    description: 直接影响公司经营的政策：产业扶持或退坡、关税与出口管制、行业准入与标准变化、监管处罚；纯宏观叙事若无公司实质影响则忽略。

# 噪音过滤：命中这些特征的信息直接降权或丢弃
noise_filters:
  - 纯技术面喊单、K线形态、支撑阻力位分析
  - 无信息增量的行情涨跌播报、盘中异动、涨跌幅排行
  - 资金面博弈描述（主力进出、北向流向、龙虎榜）除非伴随回购/增持等实质动作
  - 标题党与情绪宣泄类股吧/雪球讨论
  - 与关注公司仅名称偶然重合的无关宏观新闻
  - 荐股、跟投、晒收益类内容

# 信号分级阈值（AI 打分 0-100）
thresholds:
  highlight: 75   # 进入"今日摘要"头条
  include: 50     # 进入日报正文
  drop: 30        # 低于此分直接丢弃

# 每期日报各模块最大条目数
limits:
  summary: 8
  opportunity: 10
  risk: 10
