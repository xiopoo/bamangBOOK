<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}股市雷达日报{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <span class="brand-dot"></span>
      股市雷达<span class="brand-sub">日报</span>
    </a>
    <nav class="nav">
      <a href="/" class="{{ 'on' if request.path == '/' }}">日报</a>
      <a href="/signals" class="{{ 'on' if request.path == '/signals' }}">信号流</a>
      <a href="/favorites" class="{{ 'on' if request.path == '/favorites' }}">收藏</a>
      <a href="/settings" class="{{ 'on' if request.path == '/settings' }}">配置</a>
    </nav>
    <div class="topbar-right">
      <button id="btn-run" class="btn btn-primary btn-sm">立即采集</button>
    </div>
  </div>
  <div id="run-banner" class="run-banner hidden"></div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="foot">
  股市雷达 · 本地运行 · 仅供研究参考，不构成投资建议
</footer>

<div id="toast" class="toast"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
