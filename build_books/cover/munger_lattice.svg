<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="mg-grid-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AB1942" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#AB1942" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <!-- 底色渐变 -->
  <rect x="30" y="20" width="540" height="460" rx="4" fill="url(#mg-grid-fade)"/>
  <!-- 正交网格（格栅主线） -->
  <g stroke="#AB1942" stroke-width="1.6" opacity="0.55">
    <line x1="30" y1="80" x2="570" y2="80"/>
    <line x1="30" y1="170" x2="570" y2="170"/>
    <line x1="30" y1="260" x2="570" y2="260"/>
    <line x1="30" y1="350" x2="570" y2="350"/>
    <line x1="30" y1="440" x2="570" y2="440"/>
    <line x1="130" y1="20" x2="130" y2="480"/>
    <line x1="230" y1="20" x2="230" y2="480"/>
    <line x1="330" y1="20" x2="330" y2="480"/>
    <line x1="430" y1="20" x2="430" y2="480"/>
    <line x1="530" y1="20" x2="530" y2="480"/>
  </g>
  <!-- 斜向连接线（跨学科交汇） -->
  <g stroke="#AB1942" stroke-width="1.1" opacity="0.35">
    <line x1="30" y1="480" x2="570" y2="20"/>
    <line x1="30" y1="20" x2="570" y2="480"/>
    <line x1="230" y1="20" x2="30" y2="440"/>
    <line x1="430" y1="20" x2="570" y2="440"/>
    <line x1="130" y1="480" x2="330" y2="20"/>
    <line x1="330" y1="480" x2="530" y2="20"/>
  </g>
  <!-- 交叉节点（关键模型交汇） -->
  <g fill="#AB1942">
    <circle cx="230" cy="170" r="5" opacity="0.9"/>
    <circle cx="330" cy="260" r="6" opacity="0.95"/>
    <circle cx="430" cy="350" r="5" opacity="0.9"/>
    <circle cx="330" cy="350" r="3.4" opacity="0.7"/>
    <circle cx="230" cy="260" r="3.4" opacity="0.7"/>
    <circle cx="430" cy="170" r="3.4" opacity="0.7"/>
    <circle cx="130" cy="260" r="2.6" opacity="0.55"/>
    <circle cx="530" cy="260" r="2.6" opacity="0.55"/>
  </g>
</svg>
