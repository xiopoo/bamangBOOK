<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="bf-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AB1942" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#AB1942" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#AB1942" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="bf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#AB1942" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#AB1942" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- 极简坐标网格 -->
  <g stroke="#AB1942" stroke-width="0.7" opacity="0.14">
    <line x1="70" y1="40" x2="70" y2="400"/>
    <line x1="70" y1="400" x2="580" y2="400"/>
    <line x1="70" y1="280" x2="580" y2="280"/>
    <line x1="70" y1="160" x2="580" y2="160"/>
    <line x1="70" y1="400" x2="70" y2="160"/>
  </g>
  <g stroke="#AB1942" stroke-width="0.7" opacity="0.10">
    <line x1="200" y1="400" x2="200" y2="40"/>
    <line x1="330" y1="400" x2="330" y2="40"/>
    <line x1="460" y1="400" x2="460" y2="40"/>
  </g>
  <!-- 曲线下方渐变填充 -->
  <path d="M 70 400 L 80 392 C 150 360, 230 320, 310 250 C 380 190, 450 120, 570 48 L 580 44 L 580 400 Z"
        fill="url(#bf-fill)"/>
  <!-- 复利曲线主路径 -->
  <path d="M 70 400 C 90 392, 140 372, 200 342 C 260 312, 320 272, 370 225 C 420 178, 480 120, 580 52"
        stroke="url(#bf-line)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- 时间轴起点与终点点缀 -->
  <circle cx="70" cy="400" r="4" fill="#AB1942" opacity="0.8"/>
  <circle cx="580" cy="52" r="5.5" fill="#AB1942"/>
</svg>
