<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .box { fill:#ffffff; stroke:#222; stroke-width:1.5; }
      .top { fill:#eef3fb; stroke:#2b5fa5; stroke-width:2; }
      .sub { fill:#f3fbf3; stroke:#2e7d32; stroke-width:1.5; }
      .txt { fill:#222; text-anchor:middle; }
      .line { stroke:#444; stroke-width:1.5; fill:none; }
    </style>
  </defs>

  <!-- 自然人股东（顶层） -->
  <rect class="box" x="330" y="30" width="150" height="70" rx="6"/>
  <text class="txt" x="405" y="62" font-size="17" font-weight="bold">王显娟</text>
  <text class="txt" x="405" y="88" font-size="16">约 65%</text>

  <rect class="box" x="520" y="30" width="150" height="70" rx="6"/>
  <text class="txt" x="595" y="62" font-size="17" font-weight="bold">刘林</text>
  <text class="txt" x="595" y="88" font-size="16">约 35%</text>

  <!-- 控股平台（中层） -->
  <rect class="top" x="300" y="200" width="400" height="100" rx="6"/>
  <text class="txt" x="500" y="232" font-size="20" font-weight="bold">青岛百盛餐饮管理有限公司（拟定名）</text>
  <text class="txt" x="500" y="258" font-size="15" fill="#2b5fa5">（家族控股平台）</text>
  <text class="txt" x="500" y="284" font-size="15">注册资本：500万元</text>

  <!-- 股东到平台 -->
  <path class="line" d="M405,100 L405,150 L500,150 L500,200"/>
  <path class="line" d="M595,100 L595,150 L500,150"/>

  <!-- 子公司（底层） -->
  <rect class="sub" x="40"  y="470" width="200" height="80" rx="6"/>
  <text class="txt" x="140" y="505" font-size="17" font-weight="bold">合盛荣</text>
  <text class="txt" x="140" y="532" font-size="14">（子公司）</text>

  <rect class="sub" x="280" y="470" width="200" height="80" rx="6"/>
  <text class="txt" x="380" y="505" font-size="17" font-weight="bold">新百盛</text>
  <text class="txt" x="380" y="532" font-size="14">（子公司）</text>

  <rect class="sub" x="520" y="470" width="200" height="80" rx="6"/>
  <text class="txt" x="620" y="505" font-size="17" font-weight="bold">荣小卤</text>
  <text class="txt" x="620" y="532" font-size="14">（子公司）</text>

  <rect class="sub" x="760" y="470" width="210" height="80" rx="6"/>
  <text class="txt" x="865" y="502" font-size="17" font-weight="bold">各门店子公司</text>
  <text class="txt" x="865" y="527" font-size="13" fill="#2e7d32">（9-12家·独立法人·风险隔离）</text>

  <!-- 平台到子公司 -->
  <path class="line" d="M500,300 L500,370 L140,370 L140,470"/>
  <path class="line" d="M500,370 L380,370 L380,470"/>
  <path class="line" d="M500,370 L620,370 L620,470"/>
  <path class="line" d="M500,370 L865,370 L865,470"/>

  <text class="txt" x="500" y="352" font-size="14" fill="#2b5fa5">控股平台持有下属公司股权</text>
</svg>
