<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MG-05-01 逆向求解双向箭头</title>
  <desc id="desc">从目标倒推失败条件，再建立防线，防线约束回到目标。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#AB1942"/>
    </marker>
    <marker id="arrow_gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#777"/>
    </marker>
  </defs>

  <style>
    text { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #111; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #555; }
    .label { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; }
    .tiny { font-size: 13px; fill: #555; }
    .box { fill: #fff; stroke: #111; stroke-width: 2; }
    .soft { fill: #f2f2f2; stroke: #111; stroke-width: 1.5; }
    .line { fill: none; stroke: #AB1942; stroke-width: 2.5; }
    .grayline { fill: none; stroke: #777; stroke-width: 2; stroke-dasharray: 8 6; }
    .note { font-size: 15px; fill: #AB1942; font-weight: 600; }
  </style>
  <rect width="1280" height="720" fill="#fff"/>

  <text x="55" y="58" class="title">逆向求解</text>
  <text x="55" y="86" class="subtitle">先问怎样会失败，再设计防线</text>

  <!-- 中央逆向箭头 -->
  <line x1="240" y1="240" x2="240" y2="520" class="line" marker-end="url(#arrow)"/>
  <text x="240" y="285" text-anchor="middle" class="small" fill="#AB1942">先问</text>
  <text x="240" y="305" text-anchor="middle" class="small" fill="#AB1942">怎样会失败</text>

  <!-- 目标 -->
  <rect x="380" y="150" width="340" height="80" rx="10" class="box"/>
  <text x="550" y="188" text-anchor="middle" class="small">目标：想做成的事</text>
  <text x="550" y="210" text-anchor="middle" class="tiny">正面叙述，往往只有一个版本</text>

  <!-- 失败条件 -->
  <rect x="380" y="330" width="340" height="130" rx="10" class="soft"/>
  <text x="550" y="360" text-anchor="middle" class="label">失败条件清单</text>
  <text x="550" y="392" text-anchor="middle" class="small">① 资源在完成前耗尽</text>
  <text x="550" y="416" text-anchor="middle" class="small">② 关键人中途离开</text>
  <text x="550" y="440" text-anchor="middle" class="small">③ 自我欺骗，拒绝反证</text>

  <!-- 防线 -->
  <rect x="380" y="530" width="340" height="80" rx="10" class="box"/>
  <text x="550" y="568" text-anchor="middle" class="small">防线：把失败条件挡在门外</text>
  <text x="550" y="590" text-anchor="middle" class="tiny">必要的约束与检查点</text>

  <!-- 防线反馈回目标 -->
  <line x1="980" y1="570" x2="980" y2="225" class="grayline" marker-end="url(#arrow_gray)"/>
  <text x="1040" y="400" text-anchor="middle" class="tiny">防线暴露的约束，</text>
  <text x="1040" y="420" text-anchor="middle" class="tiny">反过来修正目标</text>

  <text x="640" y="672" text-anchor="middle" class="note">逆向不是不行动：它把失败路径和必要条件摆上桌面。</text>
  <text x="1256" y="702" text-anchor="end" class="tiny">MG-05-01｜品牌色版本</text>
</svg>
