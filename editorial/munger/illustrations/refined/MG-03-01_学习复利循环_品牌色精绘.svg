<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MG-03-01 学习复利循环</title>
  <desc id="desc">阅读、提取、应用、观察、反馈、修正的六节点学习循环。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#AB1942"/>
    </marker>
  </defs>

  <style>
    text { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #111; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #555; }
    .label { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; }
    .tiny { font-size: 13px; fill: #555; }
    .box { fill: #fff; stroke: #111; stroke-width: 2; }
    .soft { fill: #f2f2f2; stroke: #111; stroke-width: 1.5; }
    .line { fill: none; stroke: #AB1942; stroke-width: 2.5; }
    .note { font-size: 15px; fill: #AB1942; font-weight: 600; }
  </style>
  <rect width="1280" height="720" fill="#fff"/>

  <text x="55" y="58" class="title">学习复利循环</text>
  <text x="55" y="86" class="subtitle">读、练、用、认错——模型靠反馈保持活性</text>

  <!-- 六节点 -->
  <g>
    <circle cx="640" cy="180" r="42" class="box"/>
    <circle cx="830" cy="290" r="42" class="box"/>
    <circle cx="830" cy="510" r="42" class="box"/>
    <circle cx="640" cy="620" r="42" class="box"/>
    <circle cx="450" cy="510" r="42" class="box"/>
    <circle cx="450" cy="290" r="42" class="box"/>
    <text x="640" y="186" text-anchor="middle" class="small">阅读</text>
    <text x="830" y="296" text-anchor="middle" class="small">提取</text>
    <text x="830" y="516" text-anchor="middle" class="small">应用</text>
    <text x="640" y="626" text-anchor="middle" class="small">观察</text>
    <text x="450" y="516" text-anchor="middle" class="small">反馈</text>
    <text x="450" y="296" text-anchor="middle" class="small">修正</text>
    <!-- 外注 -->
    <text x="640" y="140" text-anchor="middle" class="tiny">好奇心与跨学科</text>
    <text x="885" y="290" text-anchor="middle" class="tiny">模型与概念</text>
    <text x="885" y="510" text-anchor="middle" class="tiny">实际判断</text>
    <text x="640" y="690" text-anchor="middle" class="tiny">结果与反例</text>
    <text x="395" y="510" text-anchor="middle" class="tiny">事实核对</text>
    <text x="395" y="290" text-anchor="middle" class="tiny">更新或放弃</text>
  </g>

  <!-- 循环箭头（顺时针） -->
  <g class="line">
    <line x1="673" y1="199" x2="797" y2="271" marker-end="url(#arrow)"/>
    <line x1="830" y1="332" x2="830" y2="468" marker-end="url(#arrow)"/>
    <line x1="797" y1="529" x2="673" y2="601" marker-end="url(#arrow)"/>
    <line x1="607" y1="601" x2="483" y2="529" marker-end="url(#arrow)"/>
    <line x1="450" y1="468" x2="450" y2="332" marker-end="url(#arrow)"/>
    <line x1="483" y1="271" x2="607" y2="199" marker-end="url(#arrow)"/>
  </g>

  <!-- 中心：承认困惑 → 太难 -->
  <circle cx="640" cy="400" r="58" class="soft"/>
  <circle cx="640" cy="400" r="58" fill="none" stroke="#AB1942" stroke-width="2"/>
  <text x="640" y="400" text-anchor="middle" class="small">承认困惑</text>
  <text x="640" y="420" text-anchor="middle" class="small" fill="#AB1942">→ 太难</text>
  <path d="M640 458 L640 570" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="7 6"/>

  <text x="640" y="672" text-anchor="middle" class="note">循环靠真实反馈驱动；无法可靠判断的问题，可以进入"太难"篮子。</text>
  <text x="1256" y="702" text-anchor="end" class="tiny">MG-03-01｜品牌色版本</text>
</svg>
