<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MG-01-01 单一锤子与多模型视野</title>
  <desc id="desc">同一问题在单一模型与多模型下的对比。；黑白结构草图版，仅用于信息关系确认。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#777" stroke-width="2"/>
    </pattern>
  </defs>

  <style>
    text { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #111; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #555; }
    .label { font-size: 18px; font-weight: 600; }
    .small { font-size: 14px; }
    .tiny { font-size: 13px; fill: #555; }
    .box { fill: #fff; stroke: #111; stroke-width: 2; }
    .soft { fill: #f2f2f2; stroke: #111; stroke-width: 1.5; }
    .line { fill: none; stroke: #111; stroke-width: 2.5; }
    .dash_line { fill: none; stroke: #999; stroke-width: 1.5; stroke-dasharray: 7 6; }
    .note { font-size: 15px; fill: #111; font-weight: 600; }
  </style>
  <rect width="1280" height="720" fill="#fff"/>
  <text x="55" y="58" class="title">单一锤子与多模型视野</text>
  <text x="55" y="86" class="subtitle">同一个问题，两种看法</text>

  <!-- 左栏：单一锤子 -->
  <g>
    <text x="320" y="138" text-anchor="middle" class="label">① 单一锤子视野</text>
    <!-- 锤子：锤头 + 手柄 -->
    <rect x="245" y="235" width="150" height="52" rx="10" class="box"/>
    <rect x="318" y="287" width="18" height="110" rx="4" class="box"/>
    <text x="460" y="345" text-anchor="start" class="small">只有一把锤子</text>
    <!-- 钉子群：同一问题被压成钉子 -->
    <path d="M130 470 l22 -14 l22 14 l-22 14 z" class="box"/>
    <path d="M235 500 l22 -14 l22 14 l-22 14 z" class="box"/>
    <path d="M340 470 l22 -14 l22 14 l-22 14 z" class="box"/>
    <path d="M445 500 l22 -14 l22 14 l-22 14 z" class="box"/>
    <text x="320" y="590" text-anchor="middle" class="tiny">问题 A、问题 B、问题 C、问题 D</text>
    <text x="320" y="618" text-anchor="middle" class="tiny">全都被看成钉子</text>
  </g>

  <!-- 中间箭头 -->
  <line x1="618" y1="380" x2="660" y2="380" class="line" marker-end="url(#arrow)"/>

  <!-- 右栏：多模型 -->
  <g>
    <text x="960" y="138" text-anchor="middle" class="label">② 多模型视野</text>
    <circle cx="775" cy="275" r="40" class="box"/>
    <circle cx="880" cy="220" r="40" class="box"/>
    <circle cx="960" cy="202" r="40" class="box"/>
    <circle cx="1040" cy="220" r="40" class="box"/>
    <circle cx="1145" cy="275" r="40" class="box"/>
    <text x="775" y="281" text-anchor="middle" class="small">数学</text>
    <text x="880" y="226" text-anchor="middle" class="small">会计</text>
    <text x="960" y="208" text-anchor="middle" class="small">工程</text>
    <text x="1040" y="226" text-anchor="middle" class="small">心理</text>
    <text x="1145" y="281" text-anchor="middle" class="small">经济</text>
    <circle cx="960" cy="440" r="58" class="soft"/>
    <text x="960" y="446" text-anchor="middle" class="small">同一个</text>
    <text x="960" y="466" text-anchor="middle" class="small">问题</text>
    <path d="M790 305 L930 405 M890 258 L950 390 M960 242 L960 382 M1030 258 L970 390 M1115 292 L985 405" class="line"/>
    <text x="960" y="590" text-anchor="middle" class="tiny">问题还是那个问题</text>
    <text x="960" y="618" text-anchor="middle" class="tiny">被多个学科拆开检查</text>
  </g>

  <text x="640" y="672" text-anchor="middle" class="note">模型越少，问题越像钉子；模型越多，同一个问题越清晰。</text>
  <text x="1256" y="702" text-anchor="end" class="tiny">MG-01-01｜结构草图</text>
</svg>
