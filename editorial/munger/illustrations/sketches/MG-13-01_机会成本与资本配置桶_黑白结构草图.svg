<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MG-13-01 机会成本与资本配置</title>
  <desc id="desc">机会按最佳替代方案排序；确信时重注，其余不投。；黑白结构草图版，仅用于信息关系确认。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
  </defs>

  <style>
    text { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #111; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #555; }
    .label { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; }
    .tiny { font-size: 13px; fill: #555; }
    .box { fill: #fff; stroke: #111; stroke-width: 2; }
    .soft { fill: #f2f2f2; stroke: #111; stroke-width: 1.5; }
    .note { font-size: 15px; fill: #111; font-weight: 600; }
  </style>
  <rect width="1280" height="720" fill="#fff"/>
  <text x="55" y="58" class="title">机会成本与资本配置</text>
  <text x="55" y="86" class="subtitle">机会按最佳替代方案排序；确信时重注，其余不投</text>

  <!-- 左：机会排名 -->
  <text x="320" y="140" text-anchor="middle" class="label">机会排序</text>
  <rect x="120" y="165" width="400" height="54" rx="8" class="box"/>
  <rect x="120" y="234" width="400" height="54" rx="8" class="box"/>
  <rect x="120" y="303" width="400" height="54" rx="8" class="box"/>
  <rect x="120" y="372" width="400" height="54" rx="8" class="soft"/>
  <rect x="120" y="441" width="400" height="54" rx="8" class="soft"/>
  <text x="140" y="197" class="small">A　赔率最好、证据充分</text>
  <text x="140" y="266" class="small">B　次优替代</text>
  <text x="140" y="335" class="small">C　可以，但不是最好</text>
  <text x="140" y="404" class="tiny">D　证据不足</text>
  <text x="140" y="473" class="tiny">E　超出能力圈</text>

  <!-- 中：箭头 -->
  <line x1="560" y1="330" x2="640" y2="330" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 右：资本桶 -->
  <text x="920" y="140" text-anchor="middle" class="label">资本如何分配</text>
  <!-- 桶 -->
  <path d="M700 190 L1140 190 L1105 540 L735 540 Z" fill="none" stroke="#111" stroke-width="2"/>
  <!-- 重注区 -->
  <rect x="740" y="210" width="360" height="90" fill="#eeeeee"/>
  <text x="920" y="245" text-anchor="middle" class="small">重注：确信的高赔率机会</text>
  <text x="920" y="270" text-anchor="middle" class="tiny" fill="#111">集中只属于少数证据充分的机会</text>
  <!-- 少量区 -->
  <rect x="740" y="330" width="360" height="90" fill="#f2f2f2"/>
  <text x="920" y="365" text-anchor="middle" class="small">少量：可承担损失的好机会</text>
  <text x="920" y="390" text-anchor="middle" class="tiny">分散是为了存活，不是为了收益</text>
  <!-- 不投区 -->
  <rect x="740" y="450" width="360" height="70" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="920" y="485" text-anchor="middle" class="small">不投：证据不足与圈外</text>

  <text x="640" y="672" text-anchor="middle" class="note">每一个"是"，都是对别的什么说"不"。</text>
  <text x="1256" y="702" text-anchor="end" class="tiny">MG-13-01｜结构草图</text>
</svg>
