<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MG-09-01 群体误判三角</title>
  <desc id="desc">社会认同、权威与被剥夺感三因素相互强化，形成群体误判。；黑白结构草图版，仅用于信息关系确认。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
  </defs>

  <style>
    text { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #111; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #555; }
    .label { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; }
    .tiny { font-size: 13px; fill: #555; }
    .box { fill: #fff; stroke: #111; stroke-width: 2; }
    .soft { fill: #f2f2f2; stroke: #111; stroke-width: 1.5; }
    .line { fill: none; stroke: #111; stroke-width: 2.5; }
    .note { font-size: 15px; fill: #111; font-weight: 600; }
  </style>
  <rect width="1280" height="720" fill="#fff"/>
  <text x="55" y="58" class="title">群体误判三角</text>
  <text x="55" y="86" class="subtitle">社会认同、权威与被剥夺感——在不确定与压力中相互强化</text>

  <!-- 三角边 -->
  <line x1="640" y1="218" x2="365" y2="505" class="line"/>
  <line x1="640" y1="218" x2="915" y2="505" class="line"/>
  <line x1="365" y1="505" x2="915" y2="505" class="line"/>
  <!-- 边注 -->
  <text x="470" y="370" text-anchor="middle" class="tiny">跟随多数</text>
  <text x="810" y="370" text-anchor="middle" class="tiny">服从层级</text>
  <text x="640" y="542" text-anchor="middle" class="tiny">失去比得到更痛</text>

  <!-- 顶点 -->
  <circle cx="640" cy="170" r="50" class="box"/>
  <circle cx="330" cy="540" r="50" class="box"/>
  <circle cx="950" cy="540" r="50" class="box"/>
  <text x="640" y="174" text-anchor="middle" class="small">社会认同</text>
  <text x="330" y="544" text-anchor="middle" class="small">权威</text>
  <text x="950" y="544" text-anchor="middle" class="small">被剥夺感</text>

  <!-- 中心 -->
  <circle cx="640" cy="395" r="72" class="soft"/>
  <circle cx="640" cy="395" r="72" fill="none" stroke="#111" stroke-width="2"/>
  <text x="640" y="390" text-anchor="middle" class="small" fill="#111">群体</text>
  <text x="640" y="410" text-anchor="middle" class="small" fill="#111">误判</text>

  <text x="640" y="672" text-anchor="middle" class="note">不确定性越高、压力越大，三者越容易同时出现——先警惕环境，再责怪个体。</text>
  <text x="1256" y="702" text-anchor="end" class="tiny">MG-09-01｜结构草图</text>
</svg>
