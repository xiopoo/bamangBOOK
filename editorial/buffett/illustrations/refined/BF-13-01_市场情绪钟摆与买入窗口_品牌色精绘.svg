<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">BF-13-01 市场情绪钟摆与买入窗口</title><desc id="desc">情绪从极端贪婪到极端恐惧</desc>
  <style>
    text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#111;}
    .title{font-size:28px;font-weight:700;}
    .subtitle{font-size:15px;fill:#555;}
    .label{font-size:18px;font-weight:600;}
    .small{font-size:15px;}
    .tiny{font-size:12px;fill:#555;}
    .box{fill:#fff;stroke:#111;stroke-width:2;}
    .brand{fill:#fff;stroke:#AB1942;stroke-width:3;}
    .brand-fill{fill:#AB1942;fill-opacity:0.12;stroke:#AB1942;stroke-width:2;}
    .brand-solid{fill:#AB1942;stroke:#AB1942;stroke-width:2;}
    .soft{fill:#f2f2f2;stroke:#111;stroke-width:1.5;}
    .brand-line{fill:none;stroke:#AB1942;stroke-width:3;}
    .brand-text{fill:#AB1942;font-weight:700;}
  </style>
  <rect width="1200" height="800" fill="#fff"/>

  <text x="60" y="60" class="title">市场先生的情绪钟摆</text>
  <text x="60" y="88" class="subtitle">钟摆大部分时间停在中间，但每隔几年会滑到两端——极端恐惧才是长期买家的朋友，这时候才是"把桶伸出去接"的窗口</text>

  <!-- 钟摆弧线 -->
  <path d="M 200 520 A 400 400 0 0 1 1000 520" style="stroke:#111;stroke-width:2;fill:none;stroke-dasharray:8 6;"/>
  <!-- 支点 -->
  <circle cx="600" cy="150" r="12" class="brand-solid"/>
  <line x1="600" y1="162" x2="200" y2="520" class="line" style="fill:none;stroke:#AB1942;stroke-width:3;"/>
  <circle cx="200" cy="520" r="22" class="brand-solid"/>
  <text x="200" y="525" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:16px;">极 端</text>
  <text x="200" y="547" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:16px;">恐 惧</text>

  <!-- 中间位置 -->
  <line x1="600" y1="162" x2="600" y2="550" class="dash"/>
  <circle cx="600" cy="550" r="20" style="fill:none;stroke:#666;stroke-width:2;stroke-dasharray:6 5;"/>
  <text x="600" y="556" text-anchor="middle" class="tiny" style="font-weight:600;">中 点</text>

  <!-- 右极端 -->
  <circle cx="1000" cy="520" r="22" style="fill:#fff;stroke:#AB1942;stroke-width:3;"/>
  <text x="1000" y="525" text-anchor="middle" class="brand-text" style="font-weight:700;font-size:16px;">极 端</text>
  <text x="1000" y="547" text-anchor="middle" class="brand-text" style="font-weight:700;font-size:16px;">贪 婪</text>

  <!-- 下方五个刻度 -->
  <g id="band">
    <rect x="140" y="620" width="920" height="70" rx="8" class="soft"/>
    <!-- 买入窗口 -->
    <rect x="160" y="632" width="200" height="46" rx="6" class="brand-solid"/>
    <text x="260" y="661" text-anchor="middle" style="fill:#fff;font-weight:700;">✓ 买 入 窗 口</text>

    <!-- 观望区 -->
    <rect x="370" y="632" width="200" height="46" rx="6" class="box"/>
    <text x="470" y="661" text-anchor="middle" class="small">观 望 / 少 量 吸 纳</text>

    <!-- 持有区 -->
    <rect x="580" y="632" width="200" height="46" rx="6" class="box"/>
    <text x="680" y="661" text-anchor="middle" class="small">长 期 持 有（复核）</text>

    <!-- 高估减仓区 -->
    <rect x="790" y="632" width="250" height="46" rx="6" class="soft" style="stroke:#AB1942;stroke-width:2;"/>
    <text x="915" y="661" text-anchor="middle" class="brand-text small">✗ 明 显 高 估 · 减 仓 / 换 仓</text>
  </g>

  <!-- 极端恐惧区说明 -->
  <rect x="110" y="220" width="260" height="180" rx="10" class="brand-fill"/>
  <text x="240" y="258" text-anchor="middle" class="label brand-text">恐 惧 端 典 型 信 号</text>
  <line x1="140" y1="278" x2="340" y2="278" class="brand-line" style="stroke-width:1.5;"/>
  <text x="140" y="306" class="small">· 媒体/舆论一边倒喊"永远变了"</text>
  <text x="140" y="332" class="small">· 企业被打折出售，没人看基本面</text>
  <text x="140" y="358" class="small">· 现金为王/恐慌下跌/流动性紧缩</text>
  <text x="140" y="384" class="tiny">→ 把桶伸出去接，不是用顶针</text>

  <!-- 极端贪婪区说明 -->
  <rect x="830" y="220" width="260" height="180" rx="10" class="soft" style="stroke:#AB1942;stroke-width:2;"/>
  <text x="960" y="258" text-anchor="middle" class="label brand-text">贪 婪 端 典 型 信 号</text>
  <line x1="860" y1="278" x2="1060" y2="278" class="brand-line" style="stroke-width:1.5;"/>
  <text x="860" y="306" class="small">· 新范式叙事 / 高增长不看估值</text>
  <text x="860" y="332" class="small">· 新股狂热 / 杠杆爆增 / 全民选股</text>
  <text x="860" y="358" class="small">· 价格远超出保守估值范围</text>
  <text x="860" y="384" class="tiny">→ 不追、不融、不相信"这次不同"</text>

  <rect x="60" y="720" width="1080" height="40" rx="6" class="brand"/>
  <text x="600" y="746" text-anchor="middle" class="brand-text small">行为约束：别人贪婪时我恐惧，别人恐惧时我贪婪——但判断前提是：你对企业的价值判断已经独立完成</text>

  <text x="60" y="788" class="tiny">BA-024 / BA-025 / BA-026：买入窗口 + 高估减仓 + 不追涨｜品牌色版本</text>
</svg>
