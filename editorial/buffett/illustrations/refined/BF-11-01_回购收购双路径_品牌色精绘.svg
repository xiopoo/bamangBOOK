<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">BF-11-01 回购与收购双路径</title><desc id="desc">回购 vs 收购两种工具的条件/动作/结果</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#AB1942"/></marker>
  </defs>
  <style>
    text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#111;}
    .title{font-size:28px;font-weight:700;}
    .subtitle{font-size:15px;fill:#555;}
    .label{font-size:18px;font-weight:600;}
    .small{font-size:15px;}
    .tiny{font-size:12px;fill:#555;}
    .box{fill:#fff;stroke:#111;stroke-width:2;}
    .brand{fill:#fff;stroke:#AB1942;stroke-width:3;}
    .brand-fill{fill:#AB1942;fill-opacity:0.12;stroke:#AB1942;stroke-width:2;}
    .brand-solid{fill:#AB1942;stroke:#AB1942;stroke-width:2;}
    .soft{fill:#f2f2f2;stroke:#111;stroke-width:1.5;}
    .brand-line{fill:none;stroke:#AB1942;stroke-width:3;}
    .brand-text{fill:#AB1942;font-weight:700;}
  </style>
  <rect width="1200" height="800" fill="#fff"/>

  <text x="60" y="60" class="title">买自己的股票，还是买下一家公司？</text>
  <text x="60" y="88" class="subtitle">两种工具都服从同一标尺：企业质量、内在价值、价格与机会成本——都不是"为了动作而动作"的姿态</text>

  <!-- 左列：回购 -->
  <rect x="80" y="140" width="480" height="560" rx="12" class="soft"/>
  <text x="320" y="185" text-anchor="middle" class="label brand-text">路 径 ① 股 票 回 购</text>
  <line x1="120" y1="210" x2="520" y2="210" class="brand-line" style="stroke-width:1.5;"/>
  <text x="120" y="246" class="small" style="font-weight:600;">进入条件（同时成立）：</text>
  <rect x="120" y="260" width="400" height="42" rx="4" class="box"/>
  <text x="320" y="287" text-anchor="middle" class="small">a. 交易价格 ＜ 保守估计的内在价值</text>
  <rect x="120" y="312" width="400" height="42" rx="4" class="box"/>
  <text x="320" y="339" text-anchor="middle" class="small">b. 不影响现金与承诺的兑付能力</text>
  <rect x="120" y="364" width="400" height="42" rx="4" class="box"/>
  <text x="320" y="391" text-anchor="middle" class="small">c. 没有更好的企业收购机会</text>

  <line x1="320" y1="418" x2="320" y2="442" class="brand-line" marker-end="url(#arrow)"/>
  <rect x="160" y="448" width="320" height="82" rx="8" class="brand-solid"/>
  <text x="320" y="486" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:18px;">动作：公开市场回购</text>
  <text x="320" y="512" text-anchor="middle" style="fill:#ffdce4;font-size:13px;">买得越便宜，留仓股东的每股增厚越多</text>

  <line x1="320" y1="538" x2="320" y2="562" class="brand-line" marker-end="url(#arrow)"/>
  <rect x="130" y="570" width="380" height="100" rx="8" class="box" style="stroke:#AB1942;stroke-width:3;"/>
  <text x="320" y="612" text-anchor="middle" class="label brand-text">结 果</text>
  <text x="320" y="638" text-anchor="middle" class="small">不参与的股东 → 比例被动提升</text>
  <text x="320" y="660" text-anchor="middle" class="small">长期每股内在价值显著提升</text>

  <!-- 中间 OR -->
  <text x="600" y="430" text-anchor="middle" class="brand-text" style="font-size:36px;font-weight:800;">OR</text>
  <text x="600" y="460" text-anchor="middle" class="tiny">服从同一张价值标尺</text>

  <!-- 右列：收购 -->
  <rect x="640" y="140" width="480" height="560" rx="12" class="soft"/>
  <text x="880" y="185" text-anchor="middle" class="label brand-text">路 径 ② 收 购 整 家 企 业</text>
  <line x1="680" y1="210" x2="1080" y2="210" class="brand-line" style="stroke-width:1.5;"/>
  <text x="680" y="246" class="small" style="font-weight:600;">进入条件（6 项标准核心项）：</text>

  <rect x="680" y="260" width="400" height="30" rx="4" class="box"/>
  <text x="880" y="281" text-anchor="middle" class="small">① 可理解、长期可预期</text>
  <rect x="680" y="296" width="400" height="30" rx="4" class="box"/>
  <text x="880" y="317" text-anchor="middle" class="small">② 能干且正直的管理层</text>
  <rect x="680" y="332" width="400" height="30" rx="4" class="box"/>
  <text x="880" y="353" text-anchor="middle" class="small">③ 价格合理（不是"任何价格"）</text>
  <rect x="680" y="368" width="400" height="30" rx="4" class="box"/>
  <text x="880" y="389" text-anchor="middle" class="small">④ 我们有能力评估和经营</text>

  <line x1="880" y1="418" x2="880" y2="442" class="brand-line" marker-end="url(#arrow)"/>
  <rect x="720" y="448" width="320" height="82" rx="8" class="brand-solid"/>
  <text x="880" y="486" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:18px;">动作：收购并入伯克希尔</text>
  <text x="880" y="512" text-anchor="middle" style="fill:#ffdce4;font-size:13px;">买入即永久持有（不是不复核）</text>

  <line x1="880" y1="538" x2="880" y2="562" class="brand-line" marker-end="url(#arrow)"/>
  <rect x="690" y="570" width="380" height="100" rx="8" class="box" style="stroke:#AB1942;stroke-width:3;"/>
  <text x="880" y="612" text-anchor="middle" class="label brand-text">结 果</text>
  <text x="880" y="638" text-anchor="middle" class="small">完整所有权/经营权/现金流</text>
  <text x="880" y="660" text-anchor="middle" class="small">纳入统一资本配置系统</text>

  <!-- 底部误解提醒 -->
  <rect x="60" y="720" width="1080" height="40" rx="6" class="brand-fill"/>
  <text x="600" y="746" text-anchor="middle" class="brand-text small">常见误解 × 回购一定提升价值 / × 永久持有=永不复核 / × 收购越大越好</text>

  <text x="60" y="788" class="tiny">BA-015 / BA-016 / BA-017：回购价格条件 + 收购六项标准 + 持有期限｜品牌色版本</text>
</svg>
