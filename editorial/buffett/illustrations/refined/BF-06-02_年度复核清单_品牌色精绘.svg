<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">BF-06-02 年度复核清单</title><desc id="desc">定期复核检查项</desc>
  <style>
    text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#111;}
    .title{font-size:28px;font-weight:700;}
    .subtitle{font-size:15px;fill:#555;}
    .label{font-size:18px;font-weight:600;}
    .small{font-size:15px;}
    .tiny{font-size:12px;fill:#555;}
    .box{fill:#fff;stroke:#111;stroke-width:2;}
    .brand{fill:#fff;stroke:#AB1942;stroke-width:3;}
    .brand-fill{fill:#AB1942;fill-opacity:0.12;stroke:#AB1942;stroke-width:2;}
    .brand-solid{fill:#AB1942;stroke:#AB1942;stroke-width:2;}
    .soft{fill:#f2f2f2;stroke:#111;stroke-width:1.5;}
    .brand-text{fill:#AB1942;font-weight:700;}
    .brand-line{fill:none;stroke:#AB1942;stroke-width:1.5;}
  </style>
  <rect width="1200" height="800" fill="#fff"/>

  <text x="60" y="60" class="title">年度复核：定期用清单把模糊判断变得可操作</text>
  <text x="60" y="88" class="subtitle">把"我觉得还不错"拆解成四个维度的具体问题；任何一维度持续亮黄灯，就进入深入复核与减仓评估</text>

  <rect x="90" y="130" width="480" height="170" rx="10" class="brand-fill"/>
  <text x="330" y="166" text-anchor="middle" class="label brand-text" style="font-size:19px;">① 护 城 河 复 核</text>
  <line x1="140" y1="188" x2="520" y2="188" class="brand-line"/>
  <g id="c1">
    <rect x="120" y="204" width="420" height="36" rx="4" class="box"/>
    <text x="330" y="228" text-anchor="middle" class="small">行业结构是否恶化、新进入者是否真的构成威胁？</text>
    <rect x="120" y="248" width="420" height="36" rx="4" class="box"/>
    <text x="330" y="272" text-anchor="middle" class="small">毛利率 / 定价权 / 客户粘性是否有可验证的趋势性下降？</text>
  </g>

  <rect x="630" y="130" width="480" height="170" rx="10" class="brand-fill"/>
  <text x="870" y="166" text-anchor="middle" class="label brand-text" style="font-size:19px;">② 管 理 层 复 核</text>
  <line x1="680" y1="188" x2="1060" y2="188" class="brand-line"/>
  <g id="c2">
    <rect x="660" y="204" width="420" height="36" rx="4" class="box"/>
    <text x="870" y="228" text-anchor="middle" class="small">CEO/CFO 是否换任、核心经理人行为是否开始偏离？</text>
    <rect x="660" y="248" width="420" height="36" rx="4" class="box"/>
    <text x="870" y="272" text-anchor="middle" class="small">资本配置是否做了"愚蠢的收购 / 高价买自己 / 扩张出圈"？</text>
  </g>

  <rect x="90" y="330" width="480" height="170" rx="10" class="brand-fill"/>
  <text x="330" y="366" text-anchor="middle" class="label brand-text" style="font-size:19px;">③ 估 值 / 价 格 复 核</text>
  <line x1="140" y1="388" x2="520" y2="388" class="brand-line"/>
  <g id="c3">
    <rect x="120" y="404" width="420" height="36" rx="4" class="box"/>
    <text x="330" y="428" text-anchor="middle" class="small">保守内在价值区间是否需要上下修正？为什么？</text>
    <rect x="120" y="448" width="420" height="36" rx="4" class="box"/>
    <text x="330" y="472" text-anchor="middle" class="small">当前市价是否明显超出合理区间、是否到了"非卖不可"的水平？</text>
  </g>

  <rect x="630" y="330" width="480" height="170" rx="10" class="brand-fill"/>
  <text x="870" y="366" text-anchor="middle" class="label brand-text" style="font-size:19px;">④ 机 会 成 本 复 核</text>
  <line x1="680" y1="388" x2="1060" y2="388" class="brand-line"/>
  <g id="c4">
    <rect x="660" y="404" width="420" height="36" rx="4" class="box"/>
    <text x="870" y="428" text-anchor="middle" class="small">是否出现同等质量下更便宜 / 同等价格下更高质量的机会？</text>
    <rect x="660" y="448" width="420" height="36" rx="4" class="box"/>
    <text x="870" y="472" text-anchor="middle" class="small">是否需要腾出现金为极端机会预留子弹？</text>
  </g>

  <rect x="220" y="540" width="760" height="120" rx="12" class="box" style="stroke:#AB1942;stroke-width:3;"/>
  <text x="600" y="582" text-anchor="middle" class="brand-text label" style="font-size:20px;">复 核 结 果 → 三 选 一</text>
  <g id="outcomes">
    <rect x="250" y="608" width="200" height="40" rx="6" class="brand-solid"/>
    <text x="350" y="634" text-anchor="middle" style="fill:#fff;font-weight:600;">A 继续持有</text>
    <rect x="480" y="608" width="240" height="40" rx="6" class="brand-fill"/>
    <text x="600" y="634" text-anchor="middle" class="brand-text small" style="font-weight:700;">B 深入复核/小步调仓</text>
    <rect x="750" y="608" width="200" height="40" rx="6" class="soft" style="stroke:#AB1942;stroke-width:2;"/>
    <text x="850" y="634" text-anchor="middle" class="brand-text small" style="font-weight:700;">C 减仓 / 退出</text>
  </g>

  <rect x="60" y="700" width="1080" height="40" rx="6" class="brand"/>
  <text x="600" y="726" text-anchor="middle" class="brand-text small">复核不是为了制造交易频率；是防止你对"熟悉的企业"产生不切实际的感情，而对变化闭上眼</text>

  <text x="60" y="788" class="tiny">BA-035 / BA-036：年度清单复核 + 结果三选一｜品牌色版本</text>
</svg>
