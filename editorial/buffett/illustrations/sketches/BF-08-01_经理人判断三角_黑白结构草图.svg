<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">BF-08-01 经理人判断三角</title><desc id="desc">能力—精力—正直三角</desc>
    <style>
    text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#111;}
    .title{font-size:28px;font-weight:700;}
    .subtitle{font-size:15px;fill:#555;}
    .label{font-size:18px;font-weight:600;}
    .small{font-size:15px;}
    .tiny{font-size:12px;fill:#555;}
    .box{fill:#111;stroke:#111;stroke-width:2;}
    .brand{fill:#111;stroke:#111;stroke-width:3;}
    .brand-fill{fill:#111;fill:#f2f2f2;stroke:#111;stroke-width:2;}
    .brand-solid{fill:#e6e6e6;stroke:#111;stroke-width:2;}
    .soft{fill:#f2f2f2;stroke:#111;stroke-width:1.5;}
    .brand-line{fill:none;stroke:#111;stroke-width:3;}
    .brand-text{fill:#111;font-weight:700;}
  </style>
  <rect width="1200" height="800" fill="#fff"/>
  <rect x="0" y="0" width="12" height="800" fill="#111"/>

  <text x="60" y="60" class="title">好企业需要什么样的经营者？</text>
  <text x="60" y="88" class="subtitle">三角缺一不可：能力、精力与正直。缺任何一角，制度不能靠一个超级明星来撑——伟大企业不依赖英雄</text>

  <circle cx="600" cy="210" r="92" class="brand-solid"/>
  <text x="600" y="205" text-anchor="middle" style="fill:#111;font-weight:700;font-size:22px;">能 力</text>
  <text x="600" y="235" text-anchor="middle" style="fill:#111;font-size:14px;">经营纪录与判断，</text>
  <text x="600" y="258" text-anchor="middle" style="fill:#111;font-size:14px;">不是简历、学历和口才</text>

  <circle cx="320" cy="540" r="92" class="brand-solid"/>
  <text x="320" y="535" text-anchor="middle" style="fill:#111;font-weight:700;font-size:22px;">精 力</text>
  <text x="320" y="565" text-anchor="middle" style="fill:#111;font-size:14px;">对事业的持续投入，</text>
  <text x="320" y="588" text-anchor="middle" style="fill:#111;font-size:14px;">不是一两次突击</text>

  <circle cx="880" cy="540" r="92" class="brand-solid"/>
  <text x="880" y="535" text-anchor="middle" style="fill:#111;font-weight:700;font-size:22px;">正 直</text>
  <text x="880" y="565" text-anchor="middle" style="fill:#111;font-size:14px;">能力越大，</text>
  <text x="880" y="588" text-anchor="middle" style="fill:#111;font-size:14px;">方向错的代价越大</text>

  <polygon points="600,302 402,502 798,502" fill="none" stroke="#111" stroke-width="3"/>

  <rect x="430" y="430" width="340" height="120" rx="12" class="box" style="stroke-width:3;"/>
  <text x="600" y="472" text-anchor="middle" class="brand-text" style="font-size:22px;">三 角 稳 定</text>
  <text x="600" y="502" text-anchor="middle" class="small">任何一角塌：</text>
  <text x="600" y="526" text-anchor="middle" class="small">缺能力=浪费资本；缺精力=原地不动；缺正直=整家企业被带偏</text>

  <rect x="120" y="690" width="960" height="55" rx="8" class="soft"/>
  <text x="600" y="718" text-anchor="middle" class="label brand-text">如果需要一个超级明星才能取得卓越成果，那这个企业本身就不算伟大</text>
  <text x="600" y="740" text-anchor="middle" class="small">（布卢姆金家族 / 梅奥诊所 / 伯克希尔子公司经理人：对的制度里，普通能力的人能创造不普通的结果）</text>

  <text x="60" y="788" class="tiny">BA-009 / BA-010：不依赖超级明星 + 三项品质融合｜黑白结构草图</text>
</svg>
