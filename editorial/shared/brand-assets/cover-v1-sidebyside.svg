<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <radialGradient id="s1-l" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#AB1942" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#AB1942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s1-r" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#AB1942" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#AB1942" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="#FAF8F4"/>
  <!-- 左侧：树轮（巴菲特卷） -->
  <rect x="40" y="40" width="540" height="520" fill="url(#s1-l)"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="310" cy="300" r="210" stroke="#AB1942" stroke-width="2.5" opacity="0.12"/>
    <circle cx="310" cy="300" r="175" stroke="#AB1942" stroke-width="4"  opacity="0.20"/>
    <circle cx="310" cy="300" r="140" stroke="#AB1942" stroke-width="6"  opacity="0.32"/>
    <circle cx="310" cy="300" r="105" stroke="#AB1942" stroke-width="8"  opacity="0.48"/>
    <circle cx="310" cy="300" r="70"  stroke="#AB1942" stroke-width="10" opacity="0.68"/>
  </g>
  <circle cx="310" cy="300" r="16" fill="#AB1942"/>
  <!-- 右侧：格栅（芒格卷） -->
  <rect x="620" y="40" width="540" height="520" fill="url(#s1-r)"/>
  <g stroke="#AB1942" opacity="0.5">
    <line x1="660" y1="140" x2="1120" y2="140" stroke-width="2"/>
    <line x1="660" y1="240" x2="1120" y2="240" stroke-width="2"/>
    <line x1="660" y1="340" x2="1120" y2="340" stroke-width="2"/>
    <line x1="660" y1="440" x2="1120" y2="440" stroke-width="2"/>
    <line x1="760" y1="100" x2="760" y2="500" stroke-width="2"/>
    <line x1="860" y1="100" x2="860" y2="500" stroke-width="2"/>
    <line x1="960" y1="100" x2="960" y2="500" stroke-width="2"/>
    <line x1="1060" y1="100" x2="1060" y2="500" stroke-width="2"/>
  </g>
  <g stroke="#AB1942" opacity="0.28">
    <line x1="660" y1="500" x2="1120" y2="100" stroke-width="1.4"/>
    <line x1="660" y1="100" x2="1120" y2="500" stroke-width="1.4"/>
  </g>
  <g fill="#AB1942">
    <circle cx="860" cy="240" r="6"/>
    <circle cx="960" cy="340" r="7"/>
    <circle cx="760" cy="340" r="5" opacity="0.7"/>
    <circle cx="1060" cy="240" r="5" opacity="0.7"/>
    <circle cx="860" cy="440" r="5" opacity="0.6"/>
    <circle cx="960" cy="140" r="5" opacity="0.6"/>
  </g>
  <!-- 中央分隔线 -->
  <line x1="600" y1="70" x2="600" y2="530" stroke="#AB1942" stroke-width="3" opacity="0.55"/>
</svg>
