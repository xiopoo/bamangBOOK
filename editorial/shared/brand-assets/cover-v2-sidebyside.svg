    <line x1="720" y1="200" x2="780" y2="360"/>
    <line x1="880" y1="180" x2="900" y2="420"/>
    <line x1="780" y1="360" x2="900" y2="420"/>
    <line x1="1000" y1="300" x2="900" y2="420"/>
    <line x1="780" y1="360" x2="1060" y2="440"/>
    <line x1="720" y1="200" x2="680" y2="320"/>
    <line x1="680" y1="320" x2="780" y2="360"/>
    <line x1="1000" y1="300" x2="1060" y2="440"/>
  </g>
  <g fill="#AB1942">
    <circle cx="720" cy="200" r="12"/>
    <circle cx="880" cy="180" r="14"/>
    <circle cx="1000" cy="300" r="10"/>
    <circle cx="780" cy="360" r="9"/>
    <circle cx="900" cy="420" r="12"/>
    <circle cx="680" cy="320" r="7" opacity="0.6"/>
