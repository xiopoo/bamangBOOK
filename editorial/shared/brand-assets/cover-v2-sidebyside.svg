  <circle cx="90" cy="500" r="5" fill="#AB1942" opacity="0.7"/>
  <circle cx="540" cy="110" r="8" fill="#AB1942"/>
  <!-- 右侧：节点网络（芒格卷） -->
  <rect x="620" y="40" width="540" height="520" fill="url(#s2-r)"/>
  <g stroke="#AB1942" stroke-width="2" opacity="0.3">
    <line x1="720" y1="200" x2="880" y2="180"/>
