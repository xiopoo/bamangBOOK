<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="s2-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AB1942" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#AB1942" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="s2-r" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#AB1942" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#AB1942" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <!-- 左侧：复利曲线（巴菲特卷） -->
  <rect x="40" y="40" width="540" height="520" fill="url(#s2-l)"/>
  <g stroke="#AB1942" stroke-width="1" opacity="0.10">
