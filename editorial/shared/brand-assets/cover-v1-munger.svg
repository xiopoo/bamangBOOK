<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="v1-mg-halo" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#AB1942" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#AB1942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v1-mg-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AB1942" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#AB1942" stop-opacity="0.20"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="#FAF8F4"/>
  <rect width="1200" height="1200" fill="url(#v1-mg-halo)"/>
  <!-- 格栅主体：正交网格 -->
  <rect x="170" y="150" width="860" height="760" rx="6" fill="url(#v1-mg-fade)"/>
  <g stroke="#AB1942" opacity="0.5">
    <line x1="170" y1="310" x2="1030" y2="310" stroke-width="2.5"/>
    <line x1="170" y1="470" x2="1030" y2="470" stroke-width="2.5"/>
    <line x1="170" y1="630" x2="1030" y2="630" stroke-width="2.5"/>
    <line x1="170" y1="790" x2="1030" y2="790" stroke-width="2.5"/>
    <line x1="360" y1="150" x2="360" y2="910" stroke-width="2.5"/>
    <line x1="550" y1="150" x2="550" y2="910" stroke-width="2.5"/>
    <line x1="740" y1="150" x2="740" y2="910" stroke-width="2.5"/>
    <line x1="930" y1="150" x2="930" y2="910" stroke-width="2.5"/>
  </g>
  <!-- 斜向连接线：跨学科交汇 -->
  <g stroke="#AB1942" opacity="0.28">
    <line x1="170" y1="910" x2="1030" y2="150" stroke-width="1.6"/>
    <line x1="170" y1="150" x2="1030" y2="910" stroke-width="1.6"/>
    <line x1="360" y1="150" x2="170" y2="790" stroke-width="1.6"/>
    <line x1="740" y1="150" x2="1030" y2="790" stroke-width="1.6"/>
    <line x1="170" y1="470" x2="550" y2="150" stroke-width="1.6"/>
    <line x1="550" y1="910" x2="930" y2="150" stroke-width="1.6"/>
  </g>
  <!-- 交叉节点：关键模型交汇点 -->
  <g fill="#AB1942">
    <circle cx="550" cy="470" r="12"/>
    <circle cx="360" cy="630" r="8" opacity="0.8"/>
    <circle cx="740" cy="310" r="8" opacity="0.8"/>
    <circle cx="740" cy="630" r="8" opacity="0.8"/>
    <circle cx="360" cy="310" r="6" opacity="0.6"/>
    <circle cx="550" cy="790" r="6" opacity="0.6"/>
    <circle cx="930" cy="470" r="5" opacity="0.5"/>
    <circle cx="170" cy="470" r="5" opacity="0.5"/>
  </g>
  <!-- 底部装饰线 -->
  <line x1="440" y1="880" x2="760" y2="880" stroke="#454545" stroke-width="2" opacity="0.6"/>
</svg>
