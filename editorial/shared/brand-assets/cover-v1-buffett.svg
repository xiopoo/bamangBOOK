<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="v1-bf-halo" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#AB1942" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#AB1942" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#AB1942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v1-bf-ring" cx="50%" cy="50%" r="50%">
      <stop offset="88%" stop-color="#AB1942" stop-opacity="0"/>
      <stop offset="100%" stop-color="#AB1942" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="#FAF8F4"/>
  <rect width="1200" height="1200" fill="url(#v1-bf-halo)"/>
  <!-- 年轮：品牌红同心环，由外向内由淡到深 -->
  <g fill="none" stroke-linecap="round">
    <circle cx="600" cy="560" r="470" stroke="#AB1942" stroke-width="3"  opacity="0.10"/>
    <circle cx="600" cy="560" r="415" stroke="#AB1942" stroke-width="5"  opacity="0.15"/>
    <circle cx="600" cy="560" r="360" stroke="#AB1942" stroke-width="7"  opacity="0.22"/>
    <circle cx="600" cy="560" r="305" stroke="#AB1942" stroke-width="9"  opacity="0.30"/>
    <circle cx="600" cy="560" r="250" stroke="#AB1942" stroke-width="11" opacity="0.40"/>
    <circle cx="600" cy="560" r="195" stroke="#AB1942" stroke-width="13" opacity="0.52"/>
    <circle cx="600" cy="560" r="140" stroke="#AB1942" stroke-width="15" opacity="0.66"/>
    <circle cx="600" cy="560" r="85"  stroke="#AB1942" stroke-width="17" opacity="0.82"/>
  </g>
  <!-- 年轮断点：象征时间里的扰动与波动 -->
  <g stroke="#FAF8F4" stroke-width="8" opacity="0.9">
    <path d="M 130 560 A 470 470 0 0 1 205 560" transform="rotate(24 600 560)"/>
    <path d="M 240 560 A 360 360 0 0 1 310 560" transform="rotate(-40 600 560)"/>
    <path d="M 350 560 A 250 250 0 0 1 405 560" transform="rotate(12 600 560)"/>
    <path d="M 460 560 A 140 140 0 0 1 500 560" transform="rotate(-33 600 560)"/>
  </g>
  <!-- 圆心 -->
  <circle cx="600" cy="560" r="26" fill="#AB1942"/>
  <circle cx="600" cy="560" r="10" fill="#FAF8F4"/>
  <!-- 底部装饰线 -->
  <line x1="440" y1="880" x2="760" y2="880" stroke="#454545" stroke-width="2" opacity="0.6"/>
</svg>
